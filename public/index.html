<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>Warehouse Control</title><style>
:root{--bg:#f4f7fb;--panel:#fff;--text:#101828;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--accent2:#0f172a;--good:#16a34a;--warn:#d97706;--bad:#dc2626;--shadow:0 12px 35px #10182812}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Tahoma,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.ltr{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}.num{direction:ltr;unicode-bidi:embed;text-align:left;font-variant-numeric:tabular-nums}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 15% 10%,#dbeafe,transparent 30%),radial-gradient(circle at 90% 90%,#e0e7ff,transparent 35%),#f8fafc}.login-card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:0 30px 80px #0f172a20}.brand{display:flex;align-items:center;gap:13px}.logo{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:900;font-size:20px}.brand h1{margin:0;font-size:22px}.muted{color:var(--muted)}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #2563eb18}.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;transition:.15s}.btn:hover{transform:translateY(-1px)}.primary{background:var(--accent);color:#fff}.secondary{background:#eef2f7;color:#344054}.danger{background:#fee4e2;color:#b42318}.success{background:#dcfae6;color:#087443}.ghost{background:transparent;color:#475467;border:1px solid var(--line)}.app{min-height:100vh}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:20}.top-left,.top-right{display:flex;align-items:center;gap:10px}.user-chip{display:flex;align-items:center;gap:8px;padding:7px 10px;border:1px solid var(--line);border-radius:12px}.avatar{width:34px;height:34px;border-radius:10px;background:#e8eefc;display:grid;place-items:center;font-weight:900;color:#234}.layout{display:grid;grid-template-columns:240px 1fr;direction:ltr}.side{direction:rtl;background:#0b1220;color:#cbd5e1;min-height:calc(100vh - 72px);padding:18px 12px;position:sticky;top:72px;height:calc(100vh - 72px)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#cbd5e1;text-align:right;padding:12px;border-radius:10px;font-weight:700}.nav button.active,.nav button:hover{background:#182235;color:#fff}.content{direction:rtl;padding:24px;max-width:1600px;width:100%;margin:auto}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:20px}.hero h2{margin:0 0 6px;font-size:28px}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:var(--shadow)}.metric{font-size:28px;font-weight:900;margin-top:8px}.metric-label{font-size:12px;color:var(--muted);font-weight:700}.workspace{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.toolbar{padding:13px;border-bottom:1px solid var(--line);display:flex;gap:9px;flex-wrap:wrap}.toolbar input,.toolbar select{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:950px}.table th,.table td{padding:13px 12px;border-bottom:1px solid #f0f2f5;text-align:right;vertical-align:middle}.table th{font-size:12px;color:var(--muted);background:#fbfcfe;white-space:nowrap}.table tr:hover td{background:#fbfdff}.status{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800}.s-new{background:#e8f0ff;color:#175cd3}.s-processing{background:#fff4d6;color:#b54708}.s-checking{background:#efe7ff;color:#6941c6}.s-waiting{background:#f2f4f7;color:#475467}.s-completed{background:#dcfae6;color:#087443}.s-cancelled{background:#fee4e2;color:#b42318}.priority{font-size:11px;font-weight:900}.p-urgent{color:#b42318}.p-high{color:#b54708}.empty{text-align:center;padding:55px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0b122070;display:grid;place-items:center;padding:18px;z-index:50}.modal-card{background:#fff;width:min(900px,100%);max-height:90vh;overflow:auto;border-radius:20px;border:1px solid var(--line);box-shadow:0 35px 100px #0004}.modal-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.modal-body{padding:20px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.drawer{position:fixed;top:0;right:0;height:100%;width:min(600px,100%);background:#fff;z-index:45;box-shadow:-20px 0 70px #0002;overflow:auto;padding:22px}.order-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.timeline{border-right:2px solid #e5e7eb;padding-right:16px;display:grid;gap:14px}.timeline-item{position:relative}.timeline-item:before{content:"";position:absolute;right:-23px;top:5px;width:8px;height:8px;background:var(--accent);border-radius:50%}.toast{position:fixed;left:18px;bottom:18px;z-index:100;background:#101828;color:#fff;border-radius:12px;padding:12px 16px;box-shadow:0 20px 50px #0003;max-width:360px}.theme-dark{--bg:#0b1220;--panel:#111a2b;--text:#eef2f6;--muted:#98a2b3;--line:#263246}.theme-dark .top,.theme-dark .workspace,.theme-dark .card,.theme-dark .modal-card,.theme-dark .drawer,.theme-dark .field input,.theme-dark .field select,.theme-dark .field textarea,.theme-dark .toolbar input,.theme-dark .toolbar select{background:#111a2b;color:var(--text);border-color:#263246}.theme-dark .table th{background:#0f1726}.theme-dark .secondary{background:#202b3d;color:#dbe4f0}.theme-dark .ghost{color:#dbe4f0;border-color:#334155}.compact .table th,.compact .table td{padding:8px 10px}.section{margin-top:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.section-title h3{margin:0}.setting-row{display:grid;grid-template-columns:1fr 220px;gap:16px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}.setting-row input,.setting-row select{border:1px solid var(--line);border-radius:10px;padding:9px}.danger-zone{border:1px solid #fecdca;background:#fff7f6;border-radius:14px;padding:15px;margin-top:18px}.kpi-note{font-size:11px;color:var(--muted);margin-top:5px}@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:78px 1fr}.side .nav span{display:none}.side{padding:15px 8px}.nav button{text-align:center}.content{padding:16px}}@media(max-width:680px){.top{padding:0 12px}.top .brand h1{display:none}.cards{grid-template-columns:repeat(2,1fr)}.hero{display:block}.actions{margin-top:12px}.grid2,.grid3{grid-template-columns:1fr}.content{padding:12px}.setting-row{grid-template-columns:1fr}.user-chip .user-name{display:none}}
</style></head><body><div id="root"></div><script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let token=localStorage.getItem('warehouse_token')||'',me=null,appSettings={},orders=[],selected=null,ws=null;
const statusNames={new:'جديد',processing:'قيد التجهيز',checking:'تدقيق',waiting:'انتظار',completed:'مكتمل',cancelled:'ملغي'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const num=n=>`<span class="num">${Number(n||0).toLocaleString('en-US')}</span>`;
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{'x-session-token':token}:{})};let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(r.status===401){logout(false);throw Error(d.error||'انتهت الجلسة')}if(!r.ok)throw Error(d.error||'حدث خطأ');return d}
function toast(msg){let e=document.createElement('div');e.className='toast';e.textContent=msg;document.body.appendChild(e);setTimeout(()=>e.remove(),2800)}
function renderLogin(){document.body.innerHTML=`<div class="login"><form class="login-card" id="login"><div class="brand"><div class="logo">W</div><div><h1>Warehouse Control</h1><div class="muted">نظام تشغيل المستودع</div></div></div><p class="muted" style="margin:22px 0">${esc(appSettings.welcome||'نظام إدارة الطلبات والتشغيل')}</p><div class="field"><label>اسم المستخدم</label><input id="lu" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="lp" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;padding:13px">دخول آمن</button><div class="kpi-note">للمرة الأولى: admin / admin123 — غيّر كلمة المرور مباشرة.</div></form></div>`;$('#login').onsubmit=async e=>{e.preventDefault();try{let d=await api('/api/login',{method:'POST',body:JSON.stringify({username:$('#lu').value,password:$('#lp').value})});token=d.token;localStorage.setItem('warehouse_token',token);boot()}catch(e){toast(e.message)}}}
async function boot(){try{let d=await api('/api/bootstrap');me=d.user;appSettings=d.settings;applyTheme();renderApp();loadOrders();connectWS()}catch(e){renderLogin()}}
function applyTheme(){document.body.classList.toggle('theme-dark',appSettings.dark_mode==='1');document.body.classList.toggle('compact',appSettings.compact==='1');document.documentElement.style.setProperty('--accent',appSettings.accent||'#2563eb')}
function renderApp(){document.body.innerHTML=`<div class="app"><header class="top"><div class="top-left"><div class="brand"><div class="logo">W</div><div><b>${esc(appSettings.app_name||'Warehouse Control')}</b><div class="muted" style="font-size:11px">${esc(appSettings.company_name||'Warehouse Operations')}</div></div></div></div><div class="top-right"><button class="btn ghost" id="notif">🔔 <span id="badge">0</span></button><div class="user-chip"><div class="avatar">${esc((me.name||'م').slice(0,1))}</div><span class="user-name">${esc(me.name)}</span></div><button class="btn secondary" id="logout">خروج</button></div></header><div class="layout"><aside class="side"><nav class="nav"><button class="active" data-page="dashboard">⌂ <span>الرئيسية</span></button><button data-page="orders">▣ <span>الطلبات</span></button><button data-page="special">✦ <span>طلبات خاصة</span></button><button data-page="analytics">◒ <span>التحليلات</span></button>${me.role==='supervisor'?'<button data-page="users">♙ <span>المستخدمون</span></button><button data-page="settings">⚙ <span>الإعدادات</span></button><button data-page="audit">◷ <span>السجل الرقابي</span></button>':''}<button data-page="help">? <span>مركز المساعدة</span></button></nav></aside><main class="content" id="content"></main></div></div><div id="modal"></div><div id="drawer"></div>`;$$('.nav button').forEach(b=>b.onclick=()=>page(b.dataset.page));$('#logout').onclick=()=>logout(true);$('#notif').onclick=notifications;page('dashboard');updateBadge()}
function showPageError(e,title='حدث خطأ في تحميل الصفحة'){const box=$('#content');if(box)box.innerHTML=`<div class="workspace" style="padding:28px"><div class="hero"><div><h2>${esc(title)}</h2><div class="muted">${esc(e?.message||'حدث خطأ غير متوقع.')}</div></div><button class="btn primary" onclick="location.reload()">إعادة المحاولة</button></div></div>`;console.error(e)}
function page(p){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));let task=p==='dashboard'?dashboard():p==='orders'?ordersPage():p==='special'?specialPage():p==='analytics'?analyticsPage():p==='users'?usersPage():p==='settings'?settingsPage():p==='audit'?auditPage():helpPage();if(task&&typeof task.catch==='function')task.catch(e=>showPageError(e,'تعذر تحميل هذه الصفحة'))}
async function dashboard(){
  try{
    let d={totals:{total:0,new:0,processing:0,completed:0,urgent:0}};
    try{d=await api('/api/analytics')}catch(e){console.warn('Analytics unavailable:',e)}
    $('#content').innerHTML=`<div class="hero"><div><h2>نظرة تشغيلية</h2><div class="muted">${esc(appSettings.welcome||'كل شيء واضح وتحت السيطرة.')}</div></div><div class="actions"><button class="btn primary" onclick="newOrder()">＋ طلب جديد</button><button class="btn secondary" onclick="ordersPage()">فتح الطلبات</button></div></div><div class="cards"><div class="card"><div class="metric-label">إجمالي الطلبات</div><div class="metric">${num(d.totals.total)}</div></div><div class="card"><div class="metric-label">جديدة</div><div class="metric">${num(d.totals.new)}</div></div><div class="card"><div class="metric-label">قيد التنفيذ</div><div class="metric">${num(d.totals.processing)}</div></div><div class="card"><div class="metric-label">مكتملة</div><div class="metric">${num(d.totals.completed)}</div></div><div class="card"><div class="metric-label">عاجلة</div><div class="metric">${num(d.totals.urgent)}</div></div></div><div class="workspace"><div class="toolbar"><b>آخر الطلبات</b><span class="muted">تتحدث تلقائياً عند وصول تغييرات جديدة</span></div><div class="table-wrap" id="dashTable"><div class="empty">جارٍ تحميل الطلبات...</div></div></div>`;
    try{
      const od=await api('/api/orders');
      renderOrderTable((od.orders||[]).slice(0,12),'dashTable');
    }catch(e){
      $('#dashTable').innerHTML=`<div class="empty">تعذر تحميل الطلبات: ${esc(e.message||'حدث خطأ')}</div>`;
    }
  }catch(e){showPageError(e,'تعذر تحميل لوحة التحكم')}
}
async function ordersPage(){let d=await api('/api/orders');orders=d.orders;$('#content').innerHTML=`<div class="hero"><div><h2>مركز الطلبات</h2><div class="muted">بحث سريع، حالات واضحة، وأوامر مباشرة بدون فوضى.</div></div><div class="actions"><button class="btn primary" onclick="newOrder()">＋ إنشاء طلب</button></div></div><div class="workspace"><div class="toolbar"><input id="search" placeholder="ابحث برقم الطلب، العميل، القسم…"><select id="filterStatus"><option value="">كل الحالات</option>${Object.entries(statusNames).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="filterPriority"><option value="">كل الأولويات</option><option value="urgent">عاجل</option><option value="high">مرتفع</option><option value="normal">عادي</option></select><button class="btn secondary" id="refresh">تحديث</button></div><div class="table-wrap" id="ordersTable"></div></div>`;$('#refresh').onclick=loadOrders;$('#search').oninput=debounce(loadOrders,250);$('#filterStatus').onchange=loadOrders;$('#filterPriority').onchange=loadOrders;renderOrderTable(orders,'ordersTable')}
async function loadOrders(){if(!$('#ordersTable')&&!$('#dashTable'))return;let d=await api('/api/orders',{headers:{'x-session-token':token}}).catch(()=>null);if(!d)return;orders=d.orders;if($('#ordersTable'))renderOrderTable(orders,'ordersTable');if($('#dashTable'))renderOrderTable(orders.slice(0,12),'dashTable')}
function renderOrderTable(rows,target){let e=$('#'+target);if(!e)return;if($('#search')){let s=$('#search').value.toLowerCase(),st=$('#filterStatus').value,pr=$('#filterPriority').value;rows=rows.filter(o=>(!s||`${o.order_no} ${o.customer} ${o.department}`.toLowerCase().includes(s))&&(!st||o.status===st)&&(!pr||o.priority===pr))}if(!rows.length){e.innerHTML='<div class="empty">لا توجد طلبات مطابقة.</div>';return}e.innerHTML=`<table class="table"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>القسم</th><th>الأولوية</th><th>الحالة</th><th>المسؤول</th><th>التاريخ</th><th>إجراء</th></tr></thead><tbody>${rows.map(o=>`<tr><td><button class="btn ghost" onclick="openOrder('${o.id}')"><b class="num">${esc(o.order_no)}</b></button></td><td>${esc(o.customer)}</td><td>${esc(o.department||'—')}</td><td><span class="priority p-${o.priority}">${o.priority==='urgent'?'عاجل':o.priority==='high'?'مرتفع':'عادي'}</span></td><td><span class="status s-${o.status}">${statusNames[o.status]||o.status}</span></td><td>${esc(o.assigned_name||'غير مسند')}</td><td class="num">${new Date(o.created_at).toLocaleString('en-GB')}</td><td><div class="actions"><button class="btn secondary" onclick="claim('${o.id}')">استلام</button>${me.role==='supervisor'?`<button class="btn danger" onclick="deleteOrder('${o.id}')">حذف</button>`:''}</div></td></tr>`).join('')}</tbody></table>`}
function newOrder(){showModal(`<div class="modal-card"><div class="modal-head"><b>إنشاء طلب جديد</b><button class="btn ghost" onclick="closeModal()">إغلاق</button></div><form class="modal-body" id="orderForm"><div class="grid2"><div class="field"><label>رقم الطلب <span class="muted">(اختياري)</span></label><input name="order_no" placeholder="WO-2026-0001"></div><div class="field"><label>العميل / الجهة *</label><input name="customer" required></div><div class="field"><label>القسم</label><input name="department"></div><div class="field"><label>الأولوية</label><select name="priority"><option value="normal">عادي</option><option value="high">مرتفع</option><option value="urgent">عاجل</option></select></div></div><div class="field"><label>الأصناف *</label><textarea name="items" rows="5" placeholder="مثال:\nكرتون مياه | 5 | كرتون\nقفازات | 20 | زوج"></textarea></div><div class="field"><label>ملاحظات</label><textarea name="notes" rows="3"></textarea></div><button class="btn primary" style="width:100%">حفظ الطلب</button></form></div>`);$('#orderForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),items=String(f.get('items')).split('\n').map(x=>x.split('|')).map(a=>({name:(a[0]||'').trim(),qty:Number((a[1]||1).trim())||1,unit:(a[2]||'قطعة').trim()})).filter(x=>x.name);try{let d=await api('/api/orders',{method:'POST',body:JSON.stringify({order_no:f.get('order_no'),customer:f.get('customer'),department:f.get('department'),priority:f.get('priority'),items,notes:f.get('notes')})});closeModal();toast('تم إنشاء الطلب بنجاح');openOrder(d.id)}catch(e){toast(e.message)}}}
async function openOrder(id){let d=await api('/api/orders/'+id);selected=d.order;$('#drawer').innerHTML=`<aside class="drawer"><div class="order-head"><div><div class="muted">طلب</div><h2 class="num" style="margin:4px 0">${esc(selected.order_no)}</h2><span class="status s-${selected.status}">${statusNames[selected.status]}</span></div><button class="btn ghost" onclick="closeDrawer()">إغلاق</button></div><div class="section"><div class="grid2"><div class="card"><div class="metric-label">العميل</div><b>${esc(selected.customer)}</b></div><div class="card"><div class="metric-label">المسؤول</div><b>${esc(selected.assigned_name||'غير مسند')}</b></div></div></div><div class="section"><div class="section-title"><h3>الأصناف</h3><span>${num(selected.items.length)} صنف</span></div><div class="workspace"><table class="table" style="min-width:0"><tbody>${selected.items.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${num(x.qty)}</td><td>${esc(x.unit)}</td></tr>`).join('')}</tbody></table></div></div><div class="section"><div class="section-title"><h3>الإجراءات</h3></div><div class="actions"><button class="btn secondary" onclick="claim('${selected.id}')">استلام</button>${['processing','checking','waiting','completed','cancelled'].map(s=>`<button class="btn ${s==='completed'?'success':s==='cancelled'?'danger':'secondary'}" onclick="setStatus('${selected.id}','${s}')">${statusNames[s]}</button>`).join('')}${me.role==='supervisor'?`<button class="btn danger" onclick="deleteOrder('${selected.id}')">حذف الطلب</button>`:''}</div></div><div class="section"><h3>سجل الحركة</h3><div class="timeline">${selected.events.map(e=>`<div class="timeline-item"><b>${esc(e.event)}</b><div>${esc(e.detail)}</div><small class="muted">${esc(e.user_name||'النظام')} · <span class="num">${new Date(e.created_at).toLocaleString('en-GB')}</span></small></div>`).join('')}</div></div><div class="section"><h3>المحادثة</h3><div id="replies">${selected.replies.map(r=>`<div class="card" style="margin:8px 0"><b>${esc(r.user_name||'مستخدم')}</b><div>${esc(r.body)}</div></div>`).join('')}</div><div class="field"><textarea id="reply" rows="3" placeholder="اكتب ردك…"></textarea><button class="btn primary" onclick="reply('${selected.id}')">إرسال الرد</button></div></div></aside>`}
async function claim(id){try{await api('/api/orders/'+id+'/claim',{method:'POST'});toast('تم استلام الطلب');loadOrders();if(selected?.id===id)openOrder(id)}catch(e){toast(e.message)}}
async function setStatus(id,status){try{await api('/api/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status})});toast('تم تحديث الحالة');loadOrders();openOrder(id)}catch(e){toast(e.message)}}
async function deleteOrder(id){if(!confirm('سيتم حذف الطلب نهائياً. هل أنت متأكد؟'))return;try{await api('/api/orders/'+id,{method:'DELETE'});toast('تم حذف الطلب');closeDrawer();loadOrders()}catch(e){toast(e.message)}}
async function reply(id){let body=$('#reply').value.trim();if(!body)return;try{await api('/api/orders/'+id+'/reply',{method:'POST',body:JSON.stringify({body})});openOrder(id)}catch(e){toast(e.message)}}
async function specialPage(){let d=await api('/api/special');$('#content').innerHTML=`<div class="hero"><div><h2>الطلبات الخاصة</h2><div class="muted">طلبات خارج المسار المعتاد، مع حالة واضحة وسجل كامل.</div></div><button class="btn primary" onclick="newSpecial()">＋ طلب خاص</button></div><div class="workspace"><div class="table-wrap"><table class="table"><thead><tr><th>العنوان</th><th>التفاصيل</th><th>الحالة</th><th>المنشئ</th><th>التاريخ</th></tr></thead><tbody>${d.requests.map(x=>`<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.body||'—')}</td><td><span class="status ${x.status==='open'?'s-processing':'s-completed'}">${x.status==='open'?'مفتوح':'مغلق'}</span></td><td>${esc(x.creator_name||'')}</td><td class="num">${new Date(x.created_at).toLocaleString('en-GB')}</td></tr>`).join('')}</tbody></table></div></div>`}
function newSpecial(){showModal(`<div class="modal-card"><div class="modal-head"><b>طلب خاص</b><button class="btn ghost" onclick="closeModal()">إغلاق</button></div><form class="modal-body" id="sf"><div class="field"><label>العنوان</label><input name="title" required></div><div class="field"><label>التفاصيل</label><textarea name="body" rows="6"></textarea></div><button class="btn primary">حفظ</button></form></div>`);$('#sf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await api('/api/special',{method:'POST',body:JSON.stringify({title:f.get('title'),body:f.get('body')})});closeModal();specialPage()}}
async function analyticsPage(){let d=await api('/api/analytics');$('#content').innerHTML=`<div class="hero"><div><h2>التحليلات</h2><div class="muted">صورة تشغيلية مبنية على البيانات الفعلية.</div></div></div><div class="cards"><div class="card"><div class="metric-label">الإجمالي</div><div class="metric">${num(d.totals.total)}</div></div><div class="card"><div class="metric-label">مكتملة</div><div class="metric">${num(d.totals.completed)}</div></div><div class="card"><div class="metric-label">قيد التنفيذ</div><div class="metric">${num(d.totals.processing)}</div></div></div><div class="grid2"><div class="workspace"><div class="toolbar"><b>آخر 14 يوماً</b></div><table class="table" style="min-width:0"><tbody>${d.byDay.map(x=>`<tr><td class="num">${x.day}</td><td>${num(x.count)}</td><td><div style="height:8px;border-radius:99px;background:#e5e7eb"><div style="width:${Math.min(100,x.count*8)}%;height:100%;background:var(--accent);border-radius:99px"></div></div></td></tr>`).join('')}</tbody></table></div><div class="workspace"><div class="toolbar"><b>التوزيع حسب المسؤول</b></div><table class="table" style="min-width:0"><tbody>${d.byUser.map(x=>`<tr><td>${esc(x.name)}</td><td class="num">${num(x.count)}</td></tr>`).join('')}</tbody></table></div></div>`}
async function usersPage(){let d=await api('/api/users');$('#content').innerHTML=`<div class="hero"><div><h2>المستخدمون والصلاحيات</h2><div class="muted">إدارة الحسابات والأدوار والحالة من مكان واحد.</div></div><button class="btn primary" onclick="newUser()">＋ مستخدم</button></div><div class="workspace"><table class="table"><thead><tr><th>الاسم</th><th>المستخدم</th><th>الدور</th><th>الحالة</th><th>إجراء</th></tr></thead><tbody>${d.users.map(u=>`<tr><td><b>${esc(u.name)}</b></td><td class="ltr">${esc(u.username)}</td><td>${u.role==='supervisor'?'مشرف':'موظف'}</td><td>${u.active?'نشط':'موقوف'}</td><td><button class="btn secondary" onclick="editUser('${u.id}',${u.active})">تعديل</button> ${u.id!==me.id?`<button class="btn danger" onclick="removeUser('${u.id}')">حذف</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function newUser(){showModal(`<div class="modal-card"><div class="modal-head"><b>إضافة مستخدم</b><button class="btn ghost" onclick="closeModal()">إغلاق</button></div><form class="modal-body" id="uf"><div class="grid2"><div class="field"><label>الاسم</label><input name="name" required></div><div class="field"><label>اسم المستخدم</label><input name="username" required></div><div class="field"><label>كلمة المرور</label><input name="password" value="1234"></div><div class="field"><label>الدور</label><select name="role"><option value="operator">موظف</option><option value="supervisor">مشرف</option></select></div></div><button class="btn primary">حفظ</button></form></div>`);$('#uf').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{await api('/api/users',{method:'POST',body:JSON.stringify(Object.fromEntries(f))});closeModal();usersPage()}catch(e){toast(e.message)}}}
async function editUser(id,active){let name=prompt('الاسم الجديد (اتركه كما هو إن لم ترد تغييره)');if(name===null)return;let password=prompt('كلمة المرور الجديدة (اختياري)')||'';try{await api('/api/users/'+id,{method:'PATCH',body:JSON.stringify({name,active:!active,password})});usersPage()}catch(e){toast(e.message)}}
async function removeUser(id){if(!confirm('حذف المستخدم؟'))return;await api('/api/users/'+id,{method:'DELETE'});usersPage()}
async function settingsPage(){let d=await api('/api/settings');appSettings=d.settings;$('#content').innerHTML=`<div class="hero"><div><h2>مركز التحكم الكامل</h2><div class="muted">غيّر سلوك النظام والهوية والمظهر دون تعديل الكود.</div></div><button class="btn primary" onclick="saveSettings()">حفظ كل التغييرات</button></div><div class="workspace" style="padding:20px"><div class="section-title"><h3>الهوية</h3></div>${setting('app_name','اسم النظام','text')}${setting('company_name','اسم المنشأة','text')}${setting('welcome','رسالة الترحيب','text')}${setting('accent','لون الواجهة','color')}<div class="section-title" style="margin-top:24px"><h3>المظهر والتشغيل</h3></div>${setting('dark_mode','الوضع الداكن','select',['0|فاتح','1|داكن'])}${setting('compact','الوضع المضغوط','select',['0|عادي','1|مضغوط'])}${setting('auto_refresh','التحديث التلقائي','select',['1|مفعل','0|متوقف'])}${setting('refresh_seconds','ثواني التحديث','number')}${setting('items_per_page','عدد الصفوف','number')}${setting('sound','الأصوات والتنبيهات','select',['1|مفعلة','0|متوقفة'])}<div class="section-title" style="margin-top:24px"><h3>الصلاحيات</h3></div>${setting('allow_operator_delete','السماح للموظف بالحذف','select',['0|المشرف فقط','1|الموظفون أيضاً'])}${setting('require_delete_confirm','تأكيد الحذف','select',['1|نعم','0|لا'])}</div><div class="danger-zone"><b>منطقة حساسة</b><p class="muted">الحذف النهائي للطلبات متاح من صفحة الطلبات، وتتم كتابته في السجل الرقابي.</p></div>`}
function setting(k,label,type,opts){let v=appSettings[k]??'';let control=type==='select'?`<select data-setting="${k}">${opts.map(x=>{let[a,b]=x.split('|');return`<option value="${a}" ${a===v?'selected':''}>${b}</option>`}).join('')}</select>`:`<input data-setting="${k}" type="${type}" value="${esc(v)}">`;return`<div class="setting-row"><div><b>${label}</b></div>${control}</div>`}
async function saveSettings(){let obj={};$$('[data-setting]').forEach(e=>obj[e.dataset.setting]=e.value);try{let d=await api('/api/settings',{method:'PATCH',body:JSON.stringify(obj)});appSettings=d.settings;applyTheme();toast('تم حفظ الإعدادات');settingsPage()}catch(e){toast(e.message)}}
async function auditPage(){let d=await api('/api/audit');$('#content').innerHTML=`<div class="hero"><div><h2>السجل الرقابي</h2><div class="muted">تتبع تغييرات المستخدمين والأحداث الحساسة.</div></div></div><div class="workspace"><table class="table"><thead><tr><th>الوقت</th><th>المستخدم</th><th>الإجراء</th><th>الكيان</th><th>التفاصيل</th></tr></thead><tbody>${d.audit.map(x=>`<tr><td class="num">${new Date(x.created_at).toLocaleString('en-GB')}</td><td>${esc(x.user_name||'النظام')}</td><td>${esc(x.action)}</td><td>${esc(x.entity)}</td><td>${esc(x.detail||'')}</td></tr>`).join('')}</tbody></table></div>`}
function helpPage(){$('#content').innerHTML=`<div class="hero"><div><h2>مركز المساعدة</h2><div class="muted">واجهة التشغيل مصممة لتكون قابلة للتوسع من داخل النظام.</div></div></div><div class="grid2"><div class="card"><h3>الأرقام الإنجليزية</h3><p class="muted">كل أرقام الطلبات والكميات والتواريخ تستخدم اتجاه LTR مستقل، حتى داخل الواجهة العربية.</p></div><div class="card"><h3>الصلاحيات</h3><p class="muted">المشرف يدير المستخدمين والإعدادات والسجل الرقابي. الموظف يعمل على الطلبات دون الوصول إلى إعدادات النظام.</p></div><div class="card"><h3>التحديث الفوري</h3><p class="muted">النظام يستخدم WebSocket لتحديث الواجهة عند تغير الطلبات والتنبيهات.</p></div><div class="card"><h3>الأمان</h3><p class="muted">الجلسات مؤقتة، وكلمات المرور مخزنة كـ hash، والأحداث الحساسة تسجل في سجل رقابي.</p></div></div>`}
async function notifications(){let d=await api('/api/notifications');showModal(`<div class="modal-card"><div class="modal-head"><b>التنبيهات</b><button class="btn ghost" onclick="closeModal()">إغلاق</button></div><div class="modal-body">${d.notifications.length?d.notifications.map(n=>`<div class="card" style="margin:8px 0"><b>${esc(n.title)}</b><div>${esc(n.body)}</div><small class="muted num">${new Date(n.created_at).toLocaleString('en-GB')}</small></div>`).join(''):'<div class="empty">لا توجد تنبيهات.</div>'}</div></div>`);await api('/api/notifications/read',{method:'POST',body:JSON.stringify({all:true})});updateBadge()}
async function updateBadge(){try{let d=await api('/api/bootstrap');if($('#badge'))$('#badge').textContent=d.unread||0}catch{}}
function showModal(html){$('#modal').innerHTML=`<div class="modal">${html}</div>`}function closeModal(){$('#modal').innerHTML=''}function closeDrawer(){$('#drawer').innerHTML=''}
function logout(send=true){if(send)api('/api/logout',{method:'POST'}).catch(()=>{});token='';localStorage.removeItem('warehouse_token');me=null;renderLogin()}
function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}
function connectWS(){try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');ws.onmessage=e=>{let m=JSON.parse(e.data);if(['order','order_deleted','notification','settings','special','summon'].includes(m.type)){loadOrders();updateBadge();if(m.type==='settings')boot()}};ws.onclose=()=>setTimeout(connectWS,3000)}catch{}}
window.newOrder=newOrder;window.openOrder=openOrder;window.claim=claim;window.setStatus=setStatus;window.deleteOrder=deleteOrder;window.reply=reply;window.closeModal=closeModal;window.closeDrawer=closeDrawer;window.specialPage=specialPage;window.newSpecial=newSpecial;window.newUser=newUser;window.editUser=editUser;window.removeUser=removeUser;window.saveSettings=saveSettings;window.notifications=notifications;
if(token)boot();else renderLogin();
</script></body></html>
