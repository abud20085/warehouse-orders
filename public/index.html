<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام طلبات المستودع</title>
<style>
body{font-family:system-ui,Tahoma,Arial;margin:0;background:#f5f6f8;color:#17202a}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px;margin:12px 0}input,textarea,select,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #ccd2d8}button{cursor:pointer}.primary{background:#17202a;color:#fff;border-color:#17202a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.hidden{display:none}.muted{color:#6b7280}.row{display:flex;gap:8px;flex-wrap:wrap}.field{margin:7px 0}.field input,.field textarea,.field select{width:100%;box-sizing:border-box}#orders{margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
<h1>📦 نظام طلبات المستودع</h1>
<div id="login" class="card">
<h2>دخول</h2>
<div class="field"><label>الواجهة</label><select id="role"><option value="downstairs">الصالة</option><option value="upstairs">المستودع</option><option value="supervisor">المشرف</option></select></div>
<div class="field"><label>الاسم</label><input id="name" placeholder="اسم الموظف"></div>
<div class="field" id="passBox"><label>كلمة مرور المشرف</label><input id="password" type="password"></div>
<button class="primary" onclick="login()">دخول</button><p id="msg" class="muted"></p>
</div>
<div id="main" class="hidden">
<div class="card"><b id="me"></b><button onclick="logout()">خروج</button></div>
<div id="create" class="card">
<h2>طلب جديد</h2><div class="grid"><input id="number" placeholder="الرقم"><input id="letter" placeholder="الحرف"><input id="size" placeholder="المقاس"><input id="color" placeholder="اللون"></div>
<div class="field"><textarea id="notes" placeholder="ملاحظات"></textarea></div><button class="primary" onclick="createOrder()">إرسال</button>
</div>
<div id="orders"></div>
</div>
</div>
<script>
let token="",me=null,items=[];
const $=id=>document.getElementById(id);
$('role').onchange=()=>$('passBox').classList.toggle('hidden',$('role').value!=='supervisor');
$('role').dispatchEvent(new Event('change'));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'خطأ');return d}
async function login(){try{const d=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:$('role').value,name:$('name').value,password:$('password').value})});const x=await d.json();if(!d.ok)throw Error(x.error);token=x.token;me=x.user;$('login').classList.add('hidden');$('main').classList.remove('hidden');$('me').textContent=me.name+' — '+me.role;await load();connect()}catch(e){$('msg').textContent=e.message}}
async function logout(){try{await api('/api/logout',{method:'POST'})}catch{}location.reload()}
async function load(){const d=await api('/api/bootstrap');items=d.orders||[];render()}
async function createOrder(){try{await api('/api/orders',{method:'POST',body:JSON.stringify({number:$('number').value,letter:$('letter').value,size:$('size').value,color:$('color').value,notes:$('notes').value})});['number','letter','size','color','notes'].forEach(x=>$(x).value='');await load()}catch(e){alert(e.message)}}
async function claim(id){try{await api('/api/orders/'+id+'/claim',{method:'POST',body:'{}'});await load()}catch(e){alert(e.message)}}
async function status(id,s){try{await api('/api/orders/'+id+'/status',{method:'POST',body:JSON.stringify({status:s})});await load()}catch(e){alert(e.message)}}
function render(){let shown=items.filter(o=>o.status!=='closed');$('orders').innerHTML=shown.length?shown.map(o=>`<div class="card"><b>#${o.id} ${esc(o.code||'طلب')}</b><div class="muted">${esc(o.sender_name||'')} · ${esc(o.status)} ${o.claimant_name?'· '+esc(o.claimant_name):''}</div><p>${esc(o.notes||'')}</p><div class="row">${me.role==='upstairs'&&o.status==='new'?`<button onclick="claim(${o.id})">استلام</button>`:''}${me.role==='upstairs'?`<button onclick="status(${o.id},'searching')">بحث</button><button onclick="status(${o.id},'prepared')">تم التجهيز</button>`:''}${me.role!=='upstairs'?`<button onclick="status(${o.id},'closed')">إغلاق</button>`:''}</div></div>`).join(''):'<div class="card">لا توجد طلبات مفتوحة</div>'}
function connect(){const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws?token='+encodeURIComponent(token));ws.onclose=()=>setTimeout(connect,3000);ws.onmessage=()=>load()}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
</body></html>
