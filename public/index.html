<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>طلبات المستودع</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      opacity: 0.8;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 12px;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .success {
      background: #16a34a;
      color: white;
    }

    .danger {
      background: #dc2626;
      color: white;
    }

    .gray {
      background: #6b7280;
      color: white;
    }

    .order {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .order-title {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .order-info {
      line-height: 1.8;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 13px;
      margin-top: 8px;
      background: #e5e7eb;
    }

    .hidden {
      display: none;
    }

    .top-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .top-row > * {
      flex: 1;
      min-width: 150px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .connection {
      text-align: center;
      padding: 8px;
      background: #fee2e2;
      color: #991b1b;
      display: none;
    }

    .connection.online {
      background: #dcfce7;
      color: #166534;
      display: block;
    }
  </style>
</head>

<body>

<header>
  <h1>📦 نظام طلبات المستودع</h1>
  <p>إرسال واستلام الطلبات بشكل مباشر</p>
</header>

<div id="connection" class="connection">
  متصل بالنظام
</div>

<div class="container">

  <!-- اختيار الجهاز -->
  <div class="card" id="setupCard">

    <h2>إعداد الجهاز</h2>

    <label>اسم الموظف / الجهاز</label>

    <input
      id="deviceName"
      placeholder="مثال: حافظ"
    >

    <label>نوع الجهاز</label>

    <select id="deviceType">
      <option value="downstairs">تحت - إرسال الطلبات</option>
      <option value="upstairs">فوق - المستودع</option>
    </select>

    <button class="primary" onclick="startSystem()">
      دخول للنظام
    </button>

  </div>


  <!-- واجهة الإرسال -->
  <div class="card hidden" id="senderPanel">

    <h2>📤 إرسال طلب للمستودع</h2>

    <label>المنتج</label>

    <input
      id="product"
      placeholder="مثال: حذاء رياضي"
    >

    <div class="top-row">

      <div>
        <label>المقاس</label>

        <input
          id="size"
          placeholder="مثال: 45"
        >
      </div>

      <div>
        <label>اللون</label>

        <input
          id="color"
          placeholder="مثال: أسود"
        >
      </div>

    </div>

    <label>ملاحظة إضافية</label>

    <textarea
      id="note"
      placeholder="مثال: إذا غير متوفر، شوف أقرب مقاس"
    ></textarea>

    <button class="primary" onclick="sendOrder()">
      إرسال الطلب
    </button>

  </div>


  <!-- طلباتي -->
  <div class="card hidden" id="senderOrdersPanel">

    <h2>📋 الطلبات التي أرسلتها</h2>

    <div id="senderOrders"></div>

  </div>


  <!-- واجهة المستودع -->
  <div class="card hidden" id="receiverPanel">

    <h2>📦 طلبات المستودع</h2>

    <div id="receiverOrders"></div>

  </div>

</div>


<script>

  let deviceName = "";
  let deviceType = "";
  let allOrders = [];


  // ==========================================
  // بدء النظام
  // ==========================================

  function startSystem() {

    deviceName = document
      .getElementById("deviceName")
      .value
      .trim();

    deviceType = document
      .getElementById("deviceType")
      .value;

    if (!deviceName) {
      alert("اكتب اسم الموظف أو الجهاز أولاً");
      return;
    }

    localStorage.setItem("warehouseDeviceName", deviceName);
    localStorage.setItem("warehouseDeviceType", deviceType);

    document
      .getElementById("setupCard")
      .classList.add("hidden");

    if (deviceType === "downstairs") {

      document
        .getElementById("senderPanel")
        .classList.remove("hidden");

      document
        .getElementById("senderOrdersPanel")
        .classList.remove("hidden");

    } else {

      document
        .getElementById("receiverPanel")
        .classList.remove("hidden");

    }

    loadOrders();
    connectEvents();
  }


  // ==========================================
  // إرسال طلب
  // ==========================================

  async function sendOrder() {

    const product = document
      .getElementById("product")
      .value
      .trim();

    const size = document
      .getElementById("size")
      .value
      .trim();

    const color = document
      .getElementById("color")
      .value
      .trim();

    const note = document
      .getElementById("note")
      .value
      .trim();


    if (!product) {
      alert("اكتب اسم المنتج");
      return;
    }


    const response = await fetch("/api/orders", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        product,
        size,
        color,
        note,
        sender: deviceName
      })

    });


    if (!response.ok) {

      alert("حدث خطأ أثناء إرسال الطلب");
      return;

    }


    document
      .getElementById("product")
      .value = "";

    document
      .getElementById("size")
      .value = "";

    document
      .getElementById("color")
      .value = "";

    document
      .getElementById("note")
      .value = "";

  }


  // ==========================================
  // تحميل الطلبات
  // ==========================================

  async function loadOrders() {

    const response = await fetch("/api/orders");

    allOrders = await response.json();

    render();
  }


  // ==========================================
  // عرض الطلبات
  // ==========================================

  function render() {

    if (deviceType === "downstairs") {

      renderSenderOrders();

    } else {

      renderReceiverOrders();

    }

  }


  // ==========================================
  // طلبات الموظف المرسل
  // ==========================================

  function renderSenderOrders() {

    const box = document
      .getElementById("senderOrders");

    const myOrders = allOrders
      .filter(order => order.sender === deviceName)
      .sort((a, b) =>
        new Date(b.createdAt) -
        new Date(a.createdAt)
      );


    if (myOrders.length === 0) {

      box.innerHTML =
        '<div class="empty">لا توجد طلبات حتى الآن</div>';

      return;

    }


    box.innerHTML = myOrders
      .map(order => {

        return `
          <div class="order">

            <div class="order-title">
              ${escapeHtml(order.product)}
            </div>

            <div class="order-info">

              المقاس:
              ${escapeHtml(order.size || "-")}
              <br>

              اللون:
              ${escapeHtml(order.color || "-")}
              <br>

              الملاحظة:
              ${escapeHtml(order.note || "-")}
              <br>

              أرسل بواسطة:
              ${escapeHtml(order.sender)}

              <br>

              الحالة:
              ${getStatusText(order.status)}

              ${
                order.claimedBy
                  ? `<br>استلمه: ${escapeHtml(order.claimedBy)}`
                  : ""
              }

            </div>

          </div>
        `;

      })
      .join("");

  }


  // ==========================================
  // طلبات المستودع
  // ==========================================

  function renderReceiverOrders() {

    const box = document
      .getElementById("receiverOrders");


    // نخفي الطلبات التي استلمها موظف آخر
    const visibleOrders = allOrders
      .filter(order => {

        if (order.status === "completed") {
          return false;
        }

        if (order.status === "closed") {
          return false;
        }

        if (
          order.claimedBy &&
          order.claimedBy !== deviceName
        ) {
          return false;
        }

        return true;

      })
      .sort((a, b) =>
        new Date(a.createdAt) -
        new Date(b.createdAt)
      );


    if (visibleOrders.length === 0) {

      box.innerHTML =
        '<div class="empty">لا توجد طلبات حالياً</div>';

      return;

    }


    box.innerHTML = visibleOrders
      .map(order => {

        const canClaim =
          !order.claimedBy &&
          order.status === "new";


        const claimedByMe =
          order.claimedBy === deviceName;


        return `
          <div class="order">

            <div class="order-title">
              📦 ${escapeHtml(order.product)}
            </div>

            <div class="order-info">

              المقاس:
              ${escapeHtml(order.size || "-")}
              <br>

              اللون:
              ${escapeHtml(order.color || "-")}
              <br>

              الملاحظة:
              ${escapeHtml(order.note || "-")}
              <br>

              أرسله:
              ${escapeHtml(order.sender)}

              <br>

              الوقت:
              ${formatDate(order.createdAt)}

            </div>


            ${
              canClaim

              ? `
                <button
                  class="primary"
                  onclick="claimOrder(${order.id})"
                >
                  استلام الطلب
                </button>
              `

              : ""
            }


            ${
              claimedByMe

              ? `
                <div class="status">
                  أنت استلمت هذا الطلب
                </div>

                <br>

                <button
                  class="success"
                  onclick="completeOrder(${order.id})"
                >
                  تم العثور عليه
                </button>

                <button
                  class="danger"
                  onclick="closeOrder(${order.id})"
                >
                  إغلاق الطلب
                </button>
              `

              : ""
            }

          </div>
        `;

      })
      .join("");

  }


  // ==========================================
  // استلام الطلب
  // ==========================================

  async function claimOrder(id) {

    const response = await fetch(
      `/api/orders/${id}/claim`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          receiver: deviceName
        })
      }
    );


    if (!response.ok) {

      const data = await response.json();

      alert(data.error || "تعذر استلام الطلب");

      loadOrders();

      return;

    }


    await loadOrders();
  }


  // ==========================================
  // إنهاء الطلب
  // ==========================================

  async function completeOrder(id) {

    await updateStatus(id, "completed");

  }


  // ==========================================
  // إغلاق الطلب
  // ==========================================

  async function closeOrder(id) {

    await updateStatus(id, "closed");

  }


  // ==========================================
  // تحديث الحالة
  // ==========================================

  async function updateStatus(id, status) {

    const response = await fetch(
      `/api/orders/${id}/status`,
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          status,
          receiver: deviceName
        })
      }
    );


    if (!response.ok) {

      const data = await response.json();

      alert(data.error || "حدث خطأ");

      return;

    }


    await loadOrders();

  }


  // ==========================================
  // الاتصال المباشر
  // ==========================================

  function connectEvents() {

    const events = new EventSource("/events");


    events.onopen = () => {

      const connection =
        document.getElementById("connection");

      connection.classList.add("online");

      connection.textContent =
        "🟢 متصل بالنظام";

    };


    events.onmessage = event => {

      const data = JSON.parse(event.data);


      if (data.order) {

        const existingIndex =
          allOrders.findIndex(
            order => order.id === data.order.id
          );


        if (existingIndex === -1) {

          allOrders.push(data.order);

        } else {

          allOrders[existingIndex] =
            data.order;

        }


        render();


        if (
          data.type === "new_order" &&
          deviceType === "upstairs"
        ) {

          notifyNewOrder();

        }

      }

    };


    events.onerror = () => {

      const connection =
        document.getElementById("connection");

      connection.classList.remove("online");

      connection.textContent =
        "🔴 الاتصال منقطع...";

    };

  }


  // ==========================================
  // تنبيه وصول طلب جديد
  // ==========================================

  function notifyNewOrder() {

    // اهتزاز الهاتف إذا كان المتصفح يدعمه
    if (navigator.vibrate) {
      navigator.vibrate([300, 150, 300]);
    }


    // إشعار المتصفح إذا سمح المستخدم
    if (
      "Notification" in window &&
      Notification.permission === "granted"
    ) {

      new Notification(
        "📦 طلب جديد",
        {
          body: "وصل طلب جديد إلى المستودع"
        }
      );

    }

  }


  // ==========================================
  // طلب صلاحية الإشعارات
  // ==========================================

  async function requestNotifications() {

    if (
      "Notification" in window &&
      Notification.permission === "default"
    ) {

      try {
        await Notification.requestPermission();
      } catch (error) {
        console.log(error);
      }

    }

  }


  // ==========================================
  // أدوات مساعدة
  // ==========================================

  function formatDate(date) {

    return new Date(date).toLocaleString(
      "ar-SA",
      {
        dateStyle: "short",
        timeStyle: "short"
      }
    );

  }


  function getStatusText(status) {

    const statuses = {

      new: "🟡 جديد",

      claimed: "🔵 تم استلامه",

      completed: "🟢 تم العثور عليه",

      closed: "⚫ مغلق"

    };

    return statuses[status] || status;

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  // ==========================================
  // استعادة إعداد الجهاز
  // ==========================================

  window.addEventListener("load", () => {

    const savedName =
      localStorage.getItem(
        "warehouseDeviceName"
      );

    const savedType =
      localStorage.getItem(
        "warehouseDeviceType"
      );


    if (savedName) {

      document
        .getElementById("deviceName")
        .value = savedName;

    }


    if (savedType) {

      document
        .getElementById("deviceType")
        .value = savedType;

    }


    requestNotifications();

  });

</script>

</body>
  </html>
