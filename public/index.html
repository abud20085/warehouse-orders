<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.json">
<title>نظام المستودع</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="toast"></div>

<section id="login" class="screen">
  <div class="login-card">
    <div class="logo">📦</div>
    <h1>نظام المستودع</h1>
    <p class="muted">نسخة تجريبية للعمل من الجوال</p>
    <div class="role-grid">
      <button onclick="chooseRole('supervisor')">🛡️<span>كمشرف</span></button>
      <button onclick="chooseRole('downstairs')">🧾<span>موظف صالة (تحت)</span></button>
      <button onclick="chooseRole('upstairs')">📦<span>موظف مستودع (فوق)</span></button>
    </div>
    <div id="loginForm"></div>
  </div>
</section>

<section id="app" class="hidden">
  <header class="topbar">
    <div><b id="meName"></b><small id="meRole"></small></div>
    <div class="top-actions">
      <button class="iconbtn" onclick="openStatus()">🟢</button>
      <button class="iconbtn" onclick="openCallPicker()">📞</button>
      <button class="iconbtn" onclick="logout()">↪️</button>
    </div>
  </header>

  <main id="content"></main>
  <nav id="nav"></nav>
</section>

<dialog id="modal"><div id="modalBody"></div></dialog>
<script src="/app.js"></script>
</body>
</html>
